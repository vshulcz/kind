kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  controllerManager:
    extraArgs:
    - name: enable-hostpath-provisioner
      value: "true"
    - name: leader-elect
      value: "false"
  scheduler:
    extraArgs:
    - name: leader-elect
      value: "false"
